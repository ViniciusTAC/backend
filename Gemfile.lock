source "https://rubygems.org"

ruby "3.1.2"

# Core framework
gem "rails", "~> 7.1.5", ">= 7.1.5.2"

# Database
gem "pg", "~> 1.5"

# Web server
gem "puma", ">= 6.4"

# Performance
gem "bootsnap", ">= 1.17", require: false

# Security / XML parser (fix Dependabot alerts)
gem "nokogiri", ">= 1.19.1"

# CORS
gem "rack-cors"

# Timezone data for Windows / containers
gem "tzinfo-data", platforms: %i[ mingw mswin x64_mingw jruby ]

group :development, :test do
  gem "debug"
  gem "error_highlight", ">= 0.4.0"
end

group :development do
  gem "web-console"
  gem "listen"
  gem "spring"
end

group :test do
  gem "capybara"
  gem "selenium-webdriver"
end
